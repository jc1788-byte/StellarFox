name: Code Quality

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format & Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            backend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check
        continue-on-error: false

      - name: Check backend formatting
        working-directory: backend
        run: npm run format:check
        continue-on-error: false

      - name: Check frontend linting
        working-directory: frontend
        run: npm run lint
        continue-on-error: false

      - name: Check backend linting
        working-directory: backend
        run: npm run lint
        continue-on-error: false

  consistency-check:
    name: Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .prettierignore exists
        run: |
          if [ ! -f .prettierignore ]; then
            echo "ERROR: .prettierignore is missing"
            exit 1
          fi
          echo "✓ .prettierignore found"

      - name: Check ESLint configs exist
        run: |
          if [ ! -f backend/.eslintrc.json ]; then
            echo "ERROR: backend/.eslintrc.json is missing"
            exit 1
          fi
          if [ ! -f frontend/.eslintrc.json ]; then
            echo "ERROR: frontend/.eslintrc.json is missing"
            exit 1
          fi
          echo "✓ ESLint configs found"

      - name: Check Prettier configs exist
        run: |
          if [ ! -f backend/.prettierrc.json ]; then
            echo "ERROR: backend/.prettierrc.json is missing"
            exit 1
          fi
          if [ ! -f frontend/.prettierrc ]; then
            echo "ERROR: frontend/.prettierrc is missing"
            exit 1
          fi
          echo "✓ Prettier configs found"

      - name: Check lint-staged and Husky config
        run: |
          if [ ! -f .lintstagedrc.json ]; then
            echo "ERROR: .lintstagedrc.json is missing"
            exit 1
          fi
          if [ ! -f .husky/pre-commit ]; then
            echo "ERROR: .husky/pre-commit is missing"
            exit 1
          fi
          echo "✓ Husky and lint-staged configs found"

  report:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    needs: [format-check, consistency-check]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.format-check.result }}" == "failure" ] || [ "${{ needs.consistency-check.result }}" == "failure" ]; then
            echo "❌ Code quality checks failed"
            exit 1
          fi
          echo "✅ All code quality checks passed"
